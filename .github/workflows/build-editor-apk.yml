name: Build and Publish Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "index.html"
      - "capacitor.config.json"
      - "assets/cat-logic-editor-icon.svg"
      - ".github/workflows/build-editor-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body>Launching Cat-Logic Editor...</body></html>' > www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Apply Cat-Logic launcher icon
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path
          import io
          svg = Path("assets/cat-logic-editor-icon.svg").read_bytes()
          base = Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg, output_width=512, output_height=512))).convert("RGBA")
          android = Path("android/app/src/main/res")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = android / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = base.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Cata-Logic-Editor.apk

      - name: Upload expiring Actions artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: cata-logic-editor-debug-apk
          path: Cata-Logic-Editor.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editor-apk-build-${{ github.run_number }}
          name: Cata-Logic Editor APK build ${{ github.run_number }}
          body: |
            Automated Cata-Logic Editor Android APK build.
            Download **Cata-Logic-Editor.apk** below.
            This is a debug-signed APK build; it is not a Play Store release.
          files: Cata-Logic-Editor.apk
          make_latest: true
