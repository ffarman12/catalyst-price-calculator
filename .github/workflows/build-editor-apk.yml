name: Build and Publish Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "index.html"
      - "editor-user-command.js"
      - "capacitor.config.json"
      - "assets/cat-logic-editor-icon.svg"
      - ".github/workflows/build-editor-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets are configured
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY" || { echo "Missing ANDROID_SIGNING_KEY"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body>Launching Cat-Logic Editor...</body></html>' > www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Apply Cat-Logic launcher icon
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path
          import io
          import re

          source = Path("assets/cat-logic-editor-icon.svg").read_text()
          svg_bytes = source.encode()
          base = Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg_bytes, output_width=512, output_height=512))).convert("RGBA")
          android = Path("android/app/src/main/res")

          # Legacy launcher icons: complete orange tile with the original white glyph.
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = android / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = base.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)

          # Android 8+ adaptive icons use separate foreground/background layers.
          # Remove only the SVG background rectangle so the glyph remains white and transparent.
          foreground_svg = re.sub(r'<rect[^>]*/>', '', source, count=1).encode()
          foreground_png = cairosvg.svg2png(bytestring=foreground_svg, output_width=512, output_height=512)
          drawable = android / "drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          Image.open(io.BytesIO(foreground_png)).convert("RGBA").save(drawable / "ic_launcher_foreground.png", optimize=True)

          # Capacitor's generated Android template includes a default Android-robot vector
          # in drawable-anydpi-v24. Android resource precedence selects that vector over
          # our custom PNG unless it is removed, which caused the installer to show the robot.
          # Override the Android template/library's Android-robot vector at the
          # highest-priority app resource location. Deleting the template file alone
          # is insufficient because the same vector is also packaged from a library.
          vector_dir = android / "drawable-anydpi-v24"
          vector_dir.mkdir(parents=True, exist_ok=True)
          (vector_dir / "ic_launcher_foreground.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="115dp"
              android:height="114dp"
              android:viewportWidth="115"
              android:viewportHeight="114">
              <path android:fillColor="#FFFFFFFF" android:pathData="M47,26 L42,31 L42,34 L79,71 L81,71 L83,70 L87,66 L87,63 L73,49 L73,48 L79,42 L79,41 L81,39 L82,39 L87,34 L87,31 L82,26 L79,26 L65,40 L64,40 L50,26 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M26,47 L26,49 L40,63 L40,65 L27,78 L26,80 L27,82 L32,87 L33,87 L47,73 L50,73 L64,87 L65,87 L68,84 L69,84 L69,83 L71,81 L71,79 L33,41 L31,42 Z"/>
          </vector>
          """)

          values = android / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#FF6500</color></resources>\n'
          )

          adaptive = android / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          (adaptive / "ic_launcher.xml").write_text(adaptive_xml)
          (adaptive / "ic_launcher_round.xml").write_text(adaptive_xml)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Decode persistent signing keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/cata-logic-release.jks"
          test -s "$RUNNER_TEMP/cata-logic-release.jks"

      - name: Sign and verify APK with persistent key
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/cata-logic-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/Cata-Logic-Editor.apk" \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/Cata-Logic-Editor.apk"
          cp "$RUNNER_TEMP/Cata-Logic-Editor.apk" Cata-Logic-Editor.apk
          rm -f "$RUNNER_TEMP/cata-logic-release.jks"


      - name: Upload expiring Actions artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: cata-logic-editor-debug-apk
          path: Cata-Logic-Editor.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editor-apk-build-${{ github.run_number }}
          name: Cata-Logic Editor APK build ${{ github.run_number }}
          body: |
            Automated Cata-Logic Editor Android APK build.
            Download **Cata-Logic-Editor.apk** below.
            This APK is signed with the persistent Cata-Logic signing key; it is not a Play Store release.
          files: Cata-Logic-Editor.apk
          make_latest: true
